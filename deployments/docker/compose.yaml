name: fashion-agent

services:
  postgres:
    # 固定 PostgreSQL 主版本，自动获得 17 系列的最新维护更新
    image: postgres:17-alpine

    # 本地开发数据库意外退出后自动恢复
    restart: unless-stopped

    environment:
      # 这些是本地开发默认值，可由环境变量覆盖
      POSTGRES_DB: ${POSTGRES_DB:-fashion_agent}
      POSTGRES_USER: ${POSTGRES_USER:-fashion_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_agent_dev}

    ports:
      # Windows 本机 5432 映射到容器的 PostgreSQL 端口
      - "5432:5432"

    volumes:
      # 即使容器重新创建，数据库数据仍保存在 Docker Volume 中
      - fashion_agent_postgres_data:/var/lib/postgresql/data

    healthcheck:
      # 定期验证数据库是否已经可以接受连接
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Redis 8 内置 RedisJSON 和 RediSearch，满足 LangGraph Checkpointer 要求
    image: redis:8-alpine
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]

    ports:
      - "6379:6379"

    volumes:
      - fashion_agent_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    # App 和迁移任务使用同一个不可变镜像，避免代码与表结构版本不一致
    image: fashion-agent-api:local
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile

    env_file:
      # 密钥只在运行时注入，不复制进镜像
      - ../../.env

    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: "false"
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-fashion_agent}:${POSTGRES_PASSWORD:-fashion_agent_dev}@postgres:5432/${POSTGRES_DB:-fashion_agent}
      DATABASE_ECHO: "false"

    command: ["alembic", "upgrade", "head"]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  collector:
    # OpenTelemetry Collector — 接收并处理来自 API 的 Trace
    # 开发环境使用 debug exporter 输出到容器日志
    # 生产环境需替换 exporter 为目标后端
    image: otel/opentelemetry-collector-contrib:0.126.0
    restart: unless-stopped

    command: ["--config", "/etc/otelcol/config.yaml"]

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      # OTLP gRPC — 应用通过此端口发送 Trace
      - "4317:4317"
      # OTLP HTTP
      - "4318:4318"
      # Collector 自身健康检查
      - "13133:13133"

    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config", "/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  app:
    image: fashion-agent-api:local
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile

    # Docker 的 init 进程负责正确转发停止信号并回收子进程
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - ../../.env

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DEBUG: "false"
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-fashion_agent}:${POSTGRES_PASSWORD:-fashion_agent_dev}@postgres:5432/${POSTGRES_DB:-fashion_agent}
      DATABASE_ECHO: "false"
      SHORT_TERM_MEMORY_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REDIS_CHECKPOINT_TTL_MINUTES: ${REDIS_CHECKPOINT_TTL_MINUTES:-10080}
      REDIS_CHECKPOINT_KEEP_LAST: ${REDIS_CHECKPOINT_KEEP_LAST:-50}
      # 容器内 Collector 地址与本地开发不同
      TELEMETRY_OTLP_ENDPOINT: ${TELEMETRY_OTLP_ENDPOINT:-http://collector:4317}
      EMBEDDING_DEVICE: cpu
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      KNOWLEDGE_REPOSITORY_PATH: /app/data/raw/Fashion-Agent-Knowledge

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

    ports:
      - "${APP_PORT:-8000}:8000"

    volumes:
      # 正式知识发布只读挂载；应用不能修改独立知识库
      - ../../data/raw/Fashion-Agent-Knowledge:/app/data/raw/Fashion-Agent-Knowledge:ro
      # Chroma 索引是可重建的本地运行数据
      - ../../data/chroma:/app/data/chroma
      # 首次下载的 Embedding 模型在容器重建后继续复用
      - fashion_agent_huggingface_cache:/home/fashion_agent/.cache/huggingface

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  fashion_agent_postgres_data:
  fashion_agent_huggingface_cache:
  fashion_agent_redis_data:
