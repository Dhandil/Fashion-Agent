[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-agent"
version = "0.1.0"
description = "Enterprise AI shopping assistant for fashion discovery."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 数据模型定义，类型校验和数据转换
    "pydantic>=2.13,<3.0",

    # 从环境变量和.env文件加载配置
    "pydantic-settings>=2.14,<3.0",

    # 提供.env文件解析能力
    "python-dotenv>=1.2,<2.0",

    # Web API 框架
    "astapi>=0.140,<0.141",

    # ASGI 应用服务器及常用扩展
    "uvicorn[standard]>=0.51,<0.52",

    # LangChain 的 OpenAI 兼容聊天模型适配器
    "langchain-openai>=1.4,<2.0",
    
    # Agent 状态图和工作流编排框架
    "langgraph>=1.2,<2.0",


]

[project.optional-dependencies]
dev = [
    # 单元测试和集成测试框架
    "pytest>=9.1,<10.0",

    # Python代码规范检查和自动格式化工具
    "ruff>=0.16,<0.17",

    # Python静态类型检查工具
    "mupy>=2.3,<3.0",

    # FastAPI 测试客户端使用的 HTTP 客户端
    "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
