[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-agent"
version = "0.1.0"
description = "Enterprise personal styling and wardrobe AI assistant."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 数据模型定义，类型校验和数据转换
    "pydantic>=2.13,<3.0",

    # 从环境变量和.env文件加载配置
    "pydantic-settings>=2.14,<3.0",

    # 提供.env文件解析能力
    "python-dotenv>=1.2,<2.0",

    # Web API 框架
    "fastapi>=0.140,<0.141",

    # ASGI 应用服务器及常用扩展
    "uvicorn[standard]>=0.51,<0.52",

    # 天气等外部 HTTP API 使用的异步客户端
    "httpx>=0.28,<0.29",

    # LangChain 的 OpenAI 兼容聊天模型适配器
    "langchain-openai>=1.4,<2.0",
    
    # Agent 状态图和工作流编排框架
    "langgraph>=1.2,<2.0",

    # Redis 短期记忆和 LangGraph Checkpointer
    "langgraph-checkpoint-redis>=0.5.1,<0.6.0",

    # Redis 异步客户端，也用于 readiness 检查
    "redis>=7.4,<8.0",

    # 可选分布式 Trace API、SDK 和 OTLP gRPC 导出器；运行时默认关闭
    "opentelemetry-api>=1.44,<2.0",
    "opentelemetry-sdk>=1.44,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2.0",

    # LangChain 与 Chroma 向量数据库适配器
    "langchain-chroma>=1.1,<2.0",

    # LangChain 的 Hugging Face 模型适配器
    "langchain-huggingface>=1.2,<2.0",

    # 本地 Embedding 模型运行库
    "sentence-transformers>=5.6,<6.0",

    # LangChain 文档切分工具
    "langchain-text-splitters>=1.1,<2.0",

    # 解析知识发布 Manifest 和 Markdown Frontmatter
    "PyYAML>=6.0,<7.0",

    # SQLAlchemy 2.x ORM 和异步数据库会话管理
    "sqlalchemy>=2.0,<2.1",

    # PostgreSQL 高性能异步驱动
    "asyncpg>=0.31,<0.32",

    # 数据库表结构版本与迁移管理
    "alembic>=1.18,<2.0",

]

[project.optional-dependencies]
dev = [
    # 单元测试和集成测试框架
    "pytest>=9.1,<10.0",

    # Python代码规范检查和自动格式化工具
    "ruff>=0.16,<0.17",

    # Python静态类型检查工具
    "mypy>=2.3,<3.0",

]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
